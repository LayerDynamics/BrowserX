[package]
name = "transportx"
version = "0.1.0"
edition = "2021"
authors = ["layerdynamics"]
license = "MIT OR Apache-2.0"
description = "QUIC/HTTP3 transport layer for Deno via FFI, wrapping Cloudflare quiche"
repository = "https://github.com/layerdynamics/browserx/crates/transportx"
readme = "README.md"
keywords = ["deno", "ffi", "quic", "http3"]
categories = ["network-programming", "api-bindings"]

[lib]
name = "transportx"
crate-type = ["cdylib"]

[dependencies]
deno_bindgen = "0.8.1"
quiche = "0.26"
mio = { version = "0.8", features = ["net", "os-poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.5.0"
parking_lot = "0.12"
ring = "0.17"
base64 = "0.22"
log = "0.4"

[dev-dependencies]
rcgen = "0.13"

[build-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
