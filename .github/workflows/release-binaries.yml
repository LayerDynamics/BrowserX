name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pixpane_artifact: libpixpane-x86_64-linux.so
            webgpu_artifact: libwebgpu_x-x86_64-linux.so
            pixpane_lib: libpixpane.so
            webgpu_lib: libwebgpu_x.so

          - os: macos-latest
            target: aarch64-apple-darwin
            pixpane_artifact: libpixpane-aarch64-macos.dylib
            webgpu_artifact: libwebgpu_x-aarch64-macos.dylib
            pixpane_lib: libpixpane.dylib
            webgpu_lib: libwebgpu_x.dylib

          - os: macos-13
            target: x86_64-apple-darwin
            pixpane_artifact: libpixpane-x86_64-macos.dylib
            webgpu_artifact: libwebgpu_x-x86_64-macos.dylib
            pixpane_lib: libpixpane.dylib
            webgpu_lib: libwebgpu_x.dylib

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pixpane_artifact: pixpane-x86_64-windows.dll
            webgpu_artifact: webgpu_x-x86_64-windows.dll
            pixpane_lib: pixpane.dll
            webgpu_lib: webgpu_x.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvulkan-dev vulkan-tools

      - name: Build pixpane
        run: cargo build --release --target ${{ matrix.target }} -p pixpane

      - name: Build webgpu_x
        run: cargo build --release --target ${{ matrix.target }} -p webgpu_x

      - name: Stage artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.pixpane_lib }} dist/${{ matrix.pixpane_artifact }}
          cp target/${{ matrix.target }}/release/${{ matrix.webgpu_lib }} dist/${{ matrix.webgpu_artifact }}

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.pixpane_lib }}" "dist\${{ matrix.pixpane_artifact }}"
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.webgpu_lib }}" "dist\${{ matrix.webgpu_artifact }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.pixpane_artifact }}
            dist/${{ matrix.webgpu_artifact }}
          generate_release_notes: true
